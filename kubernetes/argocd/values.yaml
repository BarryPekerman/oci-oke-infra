# ArgoCD Helm Chart Values - OKE Free Tier
# Resource-constrained for 2x (2 OCPU / 12GB) ARM64 nodes
# Helm chart: argo/argo-cd 10.10.2 (Argo CD v3.5.4 — tested with Kubernetes 1.33-1.36)
#
#   helm upgrade --install argocd argo/argo-cd --version 10.10.2 -n argocd -f values.yaml
#
# Image tag follows the chart's appVersion (multi-arch, runs on ARM64). Don't pin
# global.image.tag: a 2.13 pin under a 3.x chart broke diffs on Kubernetes 1.35.

# --- Server ---
server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Disable TLS on server side (Cloudflare Tunnel handles TLS)
  extraArgs:
    - --insecure

  service:
    type: ClusterIP

# --- Repo Server (+ ksops SOPS-decrypt CMP sidecar) ---
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  # Install arm64 sops + ksops into a shared volume at boot (base image ships neither).
  initContainers:
    - name: install-ksops
      image: alpine:3.20
      command: ["sh", "-c"]
      args:
        - |
          set -e
          apk add --no-cache curl tar >/dev/null
          curl -sSL -o /custom-tools/sops https://github.com/getsops/sops/releases/download/v3.9.1/sops-v3.9.1.linux.arm64
          curl -sSL https://github.com/viaduct-ai/kustomize-sops/releases/download/v4.3.3/ksops_4.3.3_Linux_arm64.tar.gz | tar -xz -C /custom-tools ksops
          chmod 0755 /custom-tools/sops /custom-tools/ksops
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools
  extraContainers:
    - name: ksops
      # Must match the chart's Argo CD version (argocd-cmp-server talks to repo-server).
      image: quay.io/argoproj/argocd:v3.5.4
      command: ["/var/run/argocd/argocd-cmp-server"]
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /home/argocd/.config/sops/age/keys.txt
        - name: PATH
          value: "/custom-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: tmp
          mountPath: /tmp
        - name: custom-tools
          mountPath: /custom-tools
        - name: argocd-cmp-cm
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: ksops.yaml
        - name: sops-age
          mountPath: /home/argocd/.config/sops/age
          readOnly: true
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: argocd-cmp-cm
      configMap:
        name: argocd-cmp-cm
    # Age private key — NOT managed by Helm/git. Bootstrap once from `pass`:
    #   pass show wiki/sops-age-key | kubectl -n argocd create secret generic sops-age --from-file=keys.txt=/dev/stdin
    - name: sops-age
      secret:
        secretName: sops-age

# --- Application Controller ---
controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Redis ---
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# --- Notifications (disabled to save resources) ---
notifications:
  enabled: false

# --- ApplicationSet Controller (no ApplicationSets in use) ---
applicationSet:
  replicas: 0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# --- Dex (SSO - disabled to save resources) ---
dex:
  enabled: false

# --- Config ---
configs:
  # ksops Config Management Plugin (consumed by the repoServer sidecar above)
  cmp:
    create: true
    plugins:
      ksops:
        generate:
          command: ["sh", "-c", "kustomize build --enable-alpha-plugins --enable-exec ."]
        discover:
          fileName: "kustomization.yaml"

  cm:
    # Argo CD 3.0 changed the default tracking from labels to annotations. Existing apps
    # (wiki, cert-manager, envoy-gateway) are label-tracked and auto-prune, so keep labels
    # to avoid orphaning/pruning surprises on the first sync after the upgrade.
    application.resourceTrackingMethod: label

  params:
    # Serve plain HTTP (TLS terminated in front of argocd-server)
    server.insecure: true
