# ArgoCD Helm Chart Values - OKE Free Tier
# Resource-constrained for single 4 OCPU / 24GB ARM64 node
# Helm chart: argo/argo-cd

global:
  # Use ARM64-compatible images
  image:
    tag: "v2.13.3"

# --- Server ---
server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Disable TLS on server side (Cloudflare Tunnel handles TLS)
  extraArgs:
    - --insecure

  service:
    type: ClusterIP

# --- Repo Server (+ ksops SOPS-decrypt CMP sidecar) ---
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  # Install arm64 sops + ksops into a shared volume at boot (base image ships neither).
  initContainers:
    - name: install-ksops
      image: alpine:3.20
      command: ["sh", "-c"]
      args:
        - |
          set -e
          apk add --no-cache curl tar >/dev/null
          curl -sSL -o /custom-tools/sops https://github.com/getsops/sops/releases/download/v3.9.1/sops-v3.9.1.linux.arm64
          curl -sSL https://github.com/viaduct-ai/kustomize-sops/releases/download/v4.3.3/ksops_4.3.3_Linux_arm64.tar.gz | tar -xz -C /custom-tools ksops
          chmod 0755 /custom-tools/sops /custom-tools/ksops
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools
  extraContainers:
    - name: ksops
      image: quay.io/argoproj/argocd:v2.13.3
      command: ["/var/run/argocd/argocd-cmp-server"]
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /home/argocd/.config/sops/age/keys.txt
        - name: PATH
          value: "/custom-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: tmp
          mountPath: /tmp
        - name: custom-tools
          mountPath: /custom-tools
        - name: argocd-cmp-cm
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: ksops.yaml
        - name: sops-age
          mountPath: /home/argocd/.config/sops/age
          readOnly: true
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: argocd-cmp-cm
      configMap:
        name: argocd-cmp-cm
    # Age private key — NOT managed by Helm/git. Bootstrap once from `pass`:
    #   pass show wiki/sops-age-key | kubectl -n argocd create secret generic sops-age --from-file=keys.txt=/dev/stdin
    - name: sops-age
      secret:
        secretName: sops-age

# --- Application Controller ---
controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Redis ---
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# --- Notifications (disabled to save resources) ---
notifications:
  enabled: false

# --- ApplicationSet Controller ---
applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# --- Dex (SSO - disabled to save resources) ---
dex:
  enabled: false

# --- Config ---
configs:
  # ksops Config Management Plugin (consumed by the repoServer sidecar above)
  cmp:
    create: true
    plugins:
      ksops:
        generate:
          command: ["sh", "-c", "kustomize build --enable-alpha-plugins --enable-exec ."]
        discover:
          fileName: "kustomization.yaml"

  params:
    # Allow insecure connections (Cloudflare Tunnel terminates TLS)
    server.insecure: true

  repositories:
    # This repo for GitOps
    oci-setup:
      url: https://github.com/YOUR_USERNAME/oci-setup.git
      name: oci-setup
      type: git
