# ArgoCD Helm Chart Values - OKE Free Tier
# Resource-constrained for 2x (2 OCPU / 12GB) ARM64 nodes
# Helm chart: argo/argo-cd 10.10.2 (Argo CD v3.5.4 — tested with Kubernetes 1.33-1.36)
#
#   helm upgrade --install argocd argo/argo-cd --version 10.10.2 -n argocd -f values.yaml
#
# Image tag follows the chart's appVersion (multi-arch, runs on ARM64). Don't pin
# global.image.tag: a 2.13 pin under a 3.x chart broke diffs on Kubernetes 1.35.

# --- Server ---
server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Plain HTTP: argocd-server is ClusterIP only (no route or tunnel), reached with
  # kubectl port-forward through the bastion tunnel.
  extraArgs:
    - --insecure

  service:
    type: ClusterIP

# --- Repo Server (+ ksops SOPS-decrypt CMP sidecar) ---
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  # Install arm64 sops + ksops into a shared volume at boot (base image ships neither).
  initContainers:
    - name: install-ksops
      # Pinned by digest (multi-arch index for 3.24): a re-pushed tag can't change what runs.
      image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      command: ["sh", "-c"]
      args:
        - |
          set -e
          apk add --no-cache curl tar >/dev/null
          # Pinned + checksum-verified (sha256 from each release's published checksums).
          curl -fsSL -o /custom-tools/sops https://github.com/getsops/sops/releases/download/v3.9.1/sops-v3.9.1.linux.arm64
          curl -fsSL -o /tmp/ksops.tgz https://github.com/viaduct-ai/kustomize-sops/releases/download/v4.3.3/ksops_4.3.3_Linux_arm64.tar.gz
          echo "bc946fef11dbe199587adac567037b69374c4202f928ca138443539efc85b357  /custom-tools/sops" | sha256sum -c -
          echo "802a5043baa1b83ac11533cb63b94ea1dfaa2401b2a46c47b2fea9f5c4aa1e90  /tmp/ksops.tgz" | sha256sum -c -
          tar -xzf /tmp/ksops.tgz -C /custom-tools ksops
          chmod 0755 /custom-tools/sops /custom-tools/ksops
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools
  extraContainers:
    - name: ksops
      # Must match the chart's Argo CD version (argocd-cmp-server talks to repo-server).
      image: quay.io/argoproj/argocd:v3.5.4
      command: ["/var/run/argocd/argocd-cmp-server"]
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /home/argocd/.config/sops/age/keys.txt
        - name: PATH
          value: "/custom-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: tmp
          mountPath: /tmp
        - name: custom-tools
          mountPath: /custom-tools
        - name: argocd-cmp-cm
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: ksops.yaml
        - name: sops-age
          mountPath: /home/argocd/.config/sops/age
          readOnly: true
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: argocd-cmp-cm
      configMap:
        name: argocd-cmp-cm
    # Age private key — NOT managed by Helm/git. Bootstrap once from `pass`:
    #   pass show wiki/sops-age-key | kubectl -n argocd create secret generic sops-age --from-file=keys.txt=/dev/stdin
    - name: sops-age
      secret:
        secretName: sops-age

# --- Application Controller ---
controller:
  replicas: 1
  # 512Mi OOM-killed the controller while syncing kube-prometheus-stack (its
  # CRDs are huge), which stalled every app's sync. Room for large charts.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1536Mi

# --- Redis ---
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# --- Notifications (disabled to save resources) ---
notifications:
  enabled: false

# --- ApplicationSet Controller (no ApplicationSets in use) ---
applicationSet:
  replicas: 0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# --- Dex (SSO - disabled to save resources) ---
dex:
  enabled: false

# --- Config ---
configs:
  # ksops Config Management Plugin (consumed by the repoServer sidecar above)
  cmp:
    create: true
    plugins:
      ksops:
        generate:
          command: ["sh", "-c", "kustomize build --enable-alpha-plugins --enable-exec ."]
        discover:
          fileName: "kustomization.yaml"

  cm:
    # Argo CD 3.0 changed the default tracking from labels to annotations. Existing apps
    # (wiki, cert-manager, envoy-gateway) are label-tracked and auto-prune, so keep labels
    # to avoid orphaning/pruning surprises on the first sync after the upgrade.
    application.resourceTrackingMethod: label

  params:
    # Serve plain HTTP (see server.extraArgs)
    server.insecure: true
