name: OKE Infrastructure Deployment

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'kubernetes/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'kubernetes/**'
  workflow_dispatch:

env:
  TF_VERSION: '1.6.0'
  OCI_CLI_REGION: 'il-jerusalem-1'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Terraform: Plan on PR, Apply on push
  # ═══════════════════════════════════════════════════════════════
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    outputs:
      cluster_id: ${{ steps.outputs.outputs.cluster_id }}
      cluster_endpoint: ${{ steps.outputs.outputs.cluster_endpoint }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -var-file=environments/dev/terraform.tfvars -no-color -out=tfplan
        env:
          TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ./terraform
        run: terraform apply tfplan

      - name: Get Outputs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: outputs
        working-directory: ./terraform
        run: |
          echo "cluster_id=$(terraform output -raw cluster_id)" >> $GITHUB_OUTPUT
          echo "cluster_endpoint=$(terraform output -raw cluster_endpoint)" >> $GITHUB_OUTPUT
          echo "kubernetes_version=$(terraform output -raw kubernetes_version)" >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════════════════════════
  # Deploy: Configure kubectl and deploy apps
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy Applications
    needs: terraform
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OCI CLI
        uses: oracle-actions/setup-oci-cli@v1
        with:
          user: ${{ secrets.OCI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          key: ${{ secrets.OCI_PRIVATE_KEY }}
          region: ${{ env.OCI_CLI_REGION }}

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id "${{ needs.terraform.outputs.cluster_id }}" \
            --file $HOME/.kube/config \
            --region ${{ env.OCI_CLI_REGION }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          echo "Kubeconfig configured"

      - name: Wait for Node Ready
        run: |
          echo "Waiting for worker node..."
          for i in $(seq 1 40); do
            READY=$(kubectl get nodes --no-headers 2>/dev/null | grep -c " Ready" || true)
            if [ "$READY" -ge 1 ]; then
              echo "Node is Ready!"
              kubectl get nodes -o wide
              exit 0
            fi
            echo "  Waiting... ($i/40)"
            sleep 15
          done
          echo "Node not ready after 10 minutes"
          kubectl get nodes -o wide || true
          exit 1

      - name: Apply StorageClass
        run: kubectl apply -f kubernetes/monitoring/storageclass.yaml

      - name: Deploy Cloudflare Tunnel
        run: |
          if [ -f kubernetes/cloudflared/secret.yaml ]; then
            kubectl apply -f kubernetes/cloudflared/
            echo "Cloudflare Tunnel deployed"
          else
            echo "Cloudflare Tunnel skipped (no secret.yaml)"
          fi

      - name: Deploy ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --values kubernetes/argocd/values.yaml \
            --wait --timeout 10m

      - name: Deploy ArgoCD Applications
        run: |
          for app in kubernetes/apps/*/argocd-app.yaml; do
            if [ -f "$app" ]; then
              kubectl apply -f "$app"
              echo "Applied: $app"
            fi
          done

      - name: Deploy Free Tier Monitor
        run: kubectl apply -f kubernetes/monitoring/

      - name: Health Check
        run: |
          echo "=== Cluster Health ==="
          kubectl get nodes
          echo ""
          echo "=== Pods ==="
          kubectl get pods -A
          echo ""
          echo "=== ArgoCD Apps ==="
          kubectl get applications -n argocd 2>/dev/null || echo "No ArgoCD apps yet"

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster**: ${{ needs.terraform.outputs.cluster_endpoint }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ArgoCD" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
